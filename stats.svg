<?xml version="1.0" encoding="UTF-8"?>
<svg width="430" height="220" viewBox="0 0 430 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="GitHub stats for man-navlakha">
  <defs>
    <linearGradient id="bgGradient" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f172a" stop-opacity="0.95"/>
      <stop offset="100%" stop-color="#050816" stop-opacity="0.84"/>
    </linearGradient>
    <radialGradient id="glassGlow" cx="0.1" cy="0.1" r="0.8">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </radialGradient>
    <clipPath id="avatarClip">
      <circle cx="380" cy="50" r="30"/>
    </clipPath>
    <filter id="glassBlur" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="9"/>
    </filter>
  </defs>

  <rect x="6" y="6" width="418" height="208" rx="22" fill="url(#bgGradient)"/>
  <rect x="6" y="6" width="418" height="208" rx="22" fill="url(#glassGlow)"/>
  <rect x="6" y="6" width="418" height="208" rx="22" stroke="rgba(255,255,255,0.25)"/>

  <g filter="url(#glassBlur)">
    <circle cx="70" cy="185" r="44" fill="#71f3c6" opacity="0.25">
      <animate attributeName="cx" values="70;84;70" dur="8s" repeatCount="indefinite"/>
    </circle>
  </g>

  <text x="34" y="48" fill="#ffffff" font-size="16" opacity="0.95">GitHub Stats</text>
  <text x="34" y="80" fill="#ffffff" font-size="24" font-weight="700">man-navlakha</text>

  <line x1="34" y1="118" x2="396" y2="118" stroke="rgba(255,255,255,0.24)"/>

  <text x="36" y="147" fill="#d5ddf0" font-size="14"><tspan fill="#71f3c6">Followers:</tspan> 2</text>
  <text x="36" y="171" fill="#d5ddf0" font-size="14"><tspan fill="#71f3c6">Following:</tspan> 6</text>
  <text x="220" y="147" fill="#d5ddf0" font-size="14"><tspan fill="#71f3c6">Repos:</tspan> 46</text>

  
  

  <g clip-path="url(#avatarClip)">
    <image href="https://avatars.githubusercontent.com/u/170175748?v=4" x="350" y="20" width="60" height="60" preserveAspectRatio="xMidYMid slice"/>
  </g>
  <circle cx="380" cy="50" r="30" stroke="#71f3c6" stroke-width="2" opacity="0.9"/>

  <rect x="34" y="190" width="160" height="8" rx="4" fill="rgba(255,255,255,0.18)">
    <animate attributeName="width" values="80;160;120;160" dur="6s" repeatCount="indefinite"/>
  </rect>
</svg>